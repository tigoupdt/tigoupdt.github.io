<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tigo · App</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<script>
  // --- Detección y enlaces (funciones puras: se prueban con tests/detect.test.js) ---
  /* detect:start */
  var APP_STORE_URL = 'https://apps.apple.com/app/id6834421582';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.zihao.tigo';
  function detectDevice(ua, maxTouchPoints) {
    ua = String(ua || '');
    if (/android/i.test(ua)) return 'android';
    if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
    // iPadOS se identifica como Mac: solo un iPad tiene pantalla táctil multitoque
    if (/Macintosh/i.test(ua) && Number(maxTouchPoints) > 1) return 'ios';
    return 'other';
  }
  function detectLang(language) {
    var l = String(language || '').toLowerCase().slice(0, 2);
    return ['es', 'ca', 'en', 'de', 'zh'].indexOf(l) >= 0 ? l : 'es';
  }
  // Android: abre la app Play Store; si no está (móvil sin Google), Chrome va a la web de Play
  function androidIntentUrl() {
    return 'intent://details?id=com.zihao.tigo#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url='
      + encodeURIComponent(PLAY_URL) + ';end';
  }
  /* detect:end */
  var DEVICE = detectDevice(navigator.userAgent, navigator.maxTouchPoints);
  var LANG = detectLang(navigator.language);
  document.documentElement.lang = LANG;
  document.documentElement.setAttribute('data-device', DEVICE);
  if (DEVICE === 'ios') {
    location.replace(APP_STORE_URL);
  } else if (DEVICE === 'android') {
    location.href = androidIntentUrl();
    // Navegadores que no entienden intent:// (p. ej. dentro de WeChat): si la
    // página sigue a la vista, a la web de Google Play (los botones quedan de respaldo)
    setTimeout(function () { if (!document.hidden) location.replace(PLAY_URL); }, 1500);
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1f5fa7; --blue-dark:#184c86;
    --canvas:#f4f5f7; --white:#fff; --ink:#22272e; --body:#454c56; --muted:#6b737d;
    --line:#e2e6ec; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh; background:var(--canvas); color:var(--body);
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; padding:32px 16px 28px;
  }
  .logo{width:210px; max-width:62%; height:auto; display:block; margin:8px auto 24px;}
  main{width:100%; max-width:440px;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:24px 22px; text-align:center;}
  h1{margin:0 0 6px; font-size:21px; line-height:1.3; font-weight:600; color:var(--ink);}
  p{margin:0;}
  .lead{font-size:15px;}
  .icon{width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; background:rgba(31,95,167,.09); color:var(--blue);}
  svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .btns{display:flex; flex-direction:column; gap:12px; margin-top:20px;}
  .btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; min-height:56px;
    padding:10px 18px; border-radius:14px; text-decoration:none; font-weight:600; font-size:16px; line-height:1.3;
    background:var(--blue); color:#fff; border:2px solid var(--blue);
  }
  .btn small{font-weight:400; font-size:12px; opacity:.85;}
  .btn:hover{background:var(--blue-dark); border-color:var(--blue-dark);}
  .btn.outline{background:var(--white); color:var(--blue);}
  .btn.outline:hover{background:rgba(31,95,167,.06); border-color:var(--blue);}
  a:focus-visible{outline:3px solid rgba(31,95,167,.35); outline-offset:2px;}
  footer{margin-top:24px; text-align:center; color:var(--muted); font-size:13px;}
  footer a{color:var(--muted);}
  /* En el móvil sale primero su tienda (mientras redirige, como respaldo) */
  html[data-device=android] #btn-play{order:-1; background:var(--blue); color:#fff;}
  html[data-device=android] #btn-ios{background:var(--white); color:var(--blue);}
  @media(max-width:380px){ .card{padding:20px 18px;} h1{font-size:19px;} }
</style>
</head>
<body>

<img class="logo" src="logo.png" width="1283" height="470" alt="Tigo — un poco de todo">

<main>
  <section class="card">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></div>
    <h1 data-i18n="title">Descarga la app Tigo</h1>
    <p class="lead" data-i18n="text">Tus compras en Tigo suman puntos. Disponible para iPhone y Android.</p>
    <div class="btns">
      <a class="btn" id="btn-ios" href="https://apps.apple.com/app/id6834421582"><small data-i18n="ios_small">Para iPhone</small><span data-i18n="ios_btn">Descargar en la App Store</span></a>
      <a class="btn outline" id="btn-play" href="https://play.google.com/store/apps/details?id=com.zihao.tigo"><small data-i18n="play_small">Para Android</small><span data-i18n="play_btn">Descargar en Google Play</span></a>
    </div>
  </section>
</main>

<footer>
  Tigo — un poco de todo · Pollença<br>
  <a id="ft-privacy" href="https://tigoupdt.github.io/tigo-privacidad/" data-i18n="privacy">Política de privacidad</a>
</footer>

<script>
(function () {
  var T = {
    es: { title: 'Descarga la app Tigo', text: 'Tus compras en Tigo suman puntos. Disponible para iPhone y Android.',
          ios_small: 'Para iPhone', ios_btn: 'Descargar en la App Store', play_small: 'Para Android', play_btn: 'Descargar en Google Play',
          privacy: 'Política de privacidad' },
    ca: { title: "Descarrega l'app Tigo", text: 'Les teves compres a Tigo sumen punts. Disponible per a iPhone i Android.',
          ios_small: 'Per a iPhone', ios_btn: "Descarrega a l'App Store", play_small: 'Per a Android', play_btn: 'Descarrega a Google Play',
          privacy: 'Política de privacitat' },
    en: { title: 'Get the Tigo app', text: 'Your purchases at Tigo earn points. Available for iPhone and Android.',
          ios_small: 'For iPhone', ios_btn: 'Download on the App Store', play_small: 'For Android', play_btn: 'Get it on Google Play',
          privacy: 'Privacy policy' },
    de: { title: 'Lade die Tigo-App herunter', text: 'Deine Einkäufe bei Tigo bringen Punkte. Verfügbar für iPhone und Android.',
          ios_small: 'Für iPhone', ios_btn: 'Im App Store laden', play_small: 'Für Android', play_btn: 'Bei Google Play herunterladen',
          privacy: 'Datenschutzerklärung' },
    zh: { title: '下载 Tigo 应用', text: '在 Tigo 购物即可累积积分。支持 iPhone 和安卓。',
          ios_small: 'iPhone 版', ios_btn: '在 App Store 下载', play_small: '安卓版', play_btn: '在 Google Play 下载',
          privacy: '隐私政策' }
  };
  var lang = window.LANG || 'es';
  var t = T[lang] || T.es;
  var nodes = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < nodes.length; i++) {
    var k = nodes[i].getAttribute('data-i18n');
    if (t[k]) nodes[i].textContent = t[k];
  }
  document.title = 'Tigo · ' + t.title;
  // La política abre en el mismo idioma (sus secciones son #es, #ca, #en, #zh, #de)
  document.getElementById('ft-privacy').href = 'https://tigoupdt.github.io/tigo-privacidad/' + (lang === 'es' ? '' : '#' + lang);
  // Android: el botón de Play también usa intent:// (abre la app Play Store)
  if (window.DEVICE === 'android') document.getElementById('btn-play').href = androidIntentUrl();
})();
</script>
</body>
</html>
